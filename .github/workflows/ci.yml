name: Build and NativeAOT

on:
    workflow_dispatch:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "11.0.x"

            - name: Build
              run: dotnet build Banned.AniParser.slnx --configuration Release

            - name: Run unit tests
              run: dotnet test Banned.AniParser.slnx --configuration Release --no-build --filter "TestCategory!=Manual"

            - name: Publish NativeAOT smoke application
              run: dotnet publish Banned.AniParser.AotSmoke/Banned.AniParser.AotSmoke.csproj --configuration Release --runtime linux-x64 --output artifacts/aot

            - name: Run NativeAOT smoke application
              run: ./artifacts/aot/Banned.AniParser.AotSmoke
